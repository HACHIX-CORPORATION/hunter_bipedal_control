LeggedRobotCfg:
  init_state:
    # target angles [rad] when action = 0.0
    default_joint_angle:
      leg_l1_joint: -0.0
      leg_l2_joint: -0.0
      leg_l3_joint: -0.36
      leg_l4_joint: 0.72
      leg_l5_joint: -0.36
      leg_r1_joint: 0.0
      leg_r2_joint: 0.0
      leg_r3_joint: -0.36
      leg_r4_joint: 0.72
      leg_r5_joint: -0.36


  control:
    stiffness:
      leg_l1_joint: 15
      leg_l2_joint: 15
      leg_l3_joint: 25
      leg_l4_joint: 25
      leg_l5_joint: 8
      leg_r1_joint: 15
      leg_r2_joint: 15
      leg_r3_joint: 25
      leg_r4_joint: 25
      leg_r5_joint: 8
    damping:
      leg_l1_joint: 0.5
      leg_l2_joint: 0.5
      leg_l3_joint: 1.0
      leg_l4_joint: 1.0
      leg_l5_joint: 0.1
      leg_r1_joint: 0.5
      leg_r2_joint: 0.5
      leg_r3_joint: 1.0
      leg_r4_joint: 1.0
      leg_r5_joint: 0.1
    action_scale: 0.5
    decimation: 10
    cycle_time: 0.64

  normalization:
    clip_scales:
      clip_observations: 100.0
      clip_actions: 100.0
    obs_scales:
      lin_vel: 2
      ang_vel: 1
      dof_pos: 1
      dof_vel: 0.05
      quat: 1
      height_measurements: 5.0
      cycle_time: 0.64


  size:
    actions_size: 10
    observations_size: 41
    num_hist: 66

  mode:
    sw_mode: False
    cmd_threshold: 0.05